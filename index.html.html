<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Gözlükçüm Optik | Kütahya</title>
    <meta name="description" content="Gözlükçüm Optik - Kütahya'nın güvenilir optik mağazası. Gözlük, lens ve göz sağlığı.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #E85D04;
            --primary-dark: #C44D00;
            --primary-light: #F48C06;
            --white: #FFFFFF;
            --light: #FFF8F0;
            --dark: #1A1A1A;
            --gray: #555555;
            --shadow: 0 8px 30px rgba(232, 93, 4, 0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(160deg, #FFF8F0 0%, #FFE8D6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--dark);
        }

        .card {
            background: var(--white);
            border-radius: 24px;
            box-shadow: var(--shadow);
            max-width: 420px;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .header {
            background: var(--white);
            padding: 28px 24px 20px;
            text-align: center;
            border-bottom: 4px solid var(--primary);
        }

        .logo-img {
            width: 100%;
            max-width: 320px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .tagline {
            margin-top: 10px;
            font-size: 13px;
            color: var(--gray);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .content {
            padding: 28px 24px 24px;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.3px;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 12px;
        }

        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 14px;
            background: var(--light);
            border-radius: 14px;
            text-decoration: none;
            color: var(--dark);
            transition: all 0.25s ease;
            border: 1.5px solid transparent;
        }

        .contact-item:hover, .contact-item:active {
            background: #FFE0C2;
            border-color: var(--primary-light);
            transform: translateY(-2px);
        }

        .icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: white;
        }

        .icon svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .contact-text {
            flex: 1;
            min-width: 0;
        }

        .contact-label {
            font-size: 11px;
            color: var(--gray);
            margin-bottom: 2px;
        }

        .contact-value {
            font-size: 14.5px;
            font-weight: 600;
            word-break: break-all;
        }

        .address-box {
            background: var(--light);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 24px;
            border-left: 4px solid var(--primary);
        }

        .address-box p {
            font-size: 14px;
            line-height: 1.55;
            color: var(--dark);
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.25s ease;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 6px 20px rgba(232, 93, 4, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(232, 93, 4, 0.45);
        }

        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background: var(--light);
        }

        .footer {
            text-align: center;
            padding: 0 24px 20px;
            font-size: 12px;
            color: var(--gray);
        }

        @media (max-width: 380px) {
            .content { padding: 24px 18px 20px; }
            .logo-img { max-width: 280px; }
        }
    </style>
</head>
